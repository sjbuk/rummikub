name: Deploy game server to Supabase

on:
  push:
    branches: [master]
    paths:
      - 'server/**'
      - 'supabase/**'
      - 'scripts/sync-shared.mjs'
      - 'src/game/**'
      - '.github/workflows/server-deploy.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and tests
        run: npx tsc --noEmit && npm test
      - name: Verify synced bundle matches tested core
        run: |
          npm run server:sync-shared
          diff -r server supabase/functions/_shared/server --exclude='*.test.ts' --exclude='README.md'
          diff src/game/rules.ts supabase/functions/_shared/src/game/rules.ts
          diff src/game/types.ts supabase/functions/_shared/src/game/types.ts

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: supabase
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Deploy migrations and functions
        run: npm run server:deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
